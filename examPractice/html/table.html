<!DOCTYPE html>
<html>
  <head>
    <title>Table Example</title>
  </head>
  <body>
    <table border="1">
      <thead>
        <tr>
          <td rowspan="2"></td>
          <td colspan="2">Average</td>
          <td rowspan="2">Redeyes</td>
        </tr>
        <tr>
          <td>Height</td>
          <td>Weight</td>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Males</td>
          <td>1.5</td>
          <td>0.004</td>
          <td>45%</td>
        </tr>
        <tr>
          <td>Females</td>
          <td>1.4</td>
          <td>0.006</td>
          <td>47%</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
