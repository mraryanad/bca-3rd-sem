<!DOCTYPE html>
<html>
  <head>
    <title>Form Example</title>
  </head>

  <body>
    <h1>Student Information</h1>
    <form action="">
      <label for="firstName">First Name</label>
      <input type="text" name="first_name" id="first_name" />

      <br /><br />

      <label for="lastName">Last Name</label>
      <input type="text" name="last_name" id="last_name" />

      <br /><br />

      <label for="gender">Gender</label>
      <input type="checkbox" name="Male" id="male" value="male" checked />Male
      <input type="checkbox" name="Male" id="male" value="male" />Male
      <input type="checkbox" name="Male" id="male" value="male" />Male

      <br /><br />

      <label for="subject">Subject</label>
      <input type="radio" name="c" id="c" value="c" checked />C
      <input type="radio" name="c" id="c" value="c" />Java
      <input type="radio" name="c" id="c" value="c" />PHP

      <br /><br />

      <label for="comment">Comment</label>
      <input type="text" name="comment" id="comment" />

      <br /><br />

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
