<!DOCTYPE html>
<html>
  <head>
    <title>List With CSS</title>
    <style>
      ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
        display: flex;
      }
      li {
        margin: 10px;
        border-right: 1px solid black;
        padding-right: 20px;
      }
      li:last-child {
        border: none;
      }
    </style>
  </head>

  <body>
    <ul>
      <li>Home</li>
      <li>News</li>
      <li>Contact</li>
      <li>About</li>
    </ul>
  </body>
</html>
